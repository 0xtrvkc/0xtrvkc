<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Data-to-decision analysis workflow</title>
  <desc id="desc">A technical dashboard-style visual showing raw inputs becoming structured analysis, evidence, and a decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c31"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label{font:600 14px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.4px;fill:#94a3b8}
      .title{font:700 22px Inter,Arial,sans-serif;fill:#f8fafc}
      .small{font:500 13px Inter,Arial,sans-serif;fill:#94a3b8}
      .metric{font:700 25px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#f8fafc}
    </style>
  </defs>
  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <path d="M0 65H1200M0 355H1200" stroke="#20304a"/>
  <text x="44" y="42" class="label">DATA / ANALYSIS / DECISION</text>
  <circle cx="1125" cy="35" r="5" fill="#a3e635" filter="url(#glow)"/>
  <text x="1142" y="40" class="small">TRACEABLE</text>

  <g transform="translate(44 94)">
    <text class="label">01 · INPUT</text>
    <text y="33" class="title">Raw evidence</text>
    <rect y="57" width="260" height="205" rx="14" fill="#0f1a2d" stroke="#263955"/>
    <g transform="translate(20 78)" fill="#334863">
      <rect width="70" height="12" rx="3"/><rect x="80" width="48" height="12" rx="3"/><rect x="138" width="82" height="12" rx="3"/>
      <rect y="27" width="42" height="12" rx="3"/><rect x="52" y="27" width="91" height="12" rx="3"/><rect x="153" y="27" width="67" height="12" rx="3"/>
      <rect y="54" width="96" height="12" rx="3"/><rect x="106" y="54" width="51" height="12" rx="3"/><rect x="167" y="54" width="53" height="12" rx="3"/>
    </g>
    <path d="M20 202 L60 178 L96 190 L132 128 L170 151 L220 102" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <g fill="#22d3ee"><circle cx="20" cy="202" r="4"/><circle cx="60" cy="178" r="4"/><circle cx="96" cy="190" r="4"/><circle cx="132" cy="128" r="4"/><circle cx="170" cy="151" r="4"/><circle cx="220" cy="102" r="4"/></g>
  </g>

  <path d="M332 205H384" stroke="url(#line)" stroke-width="3"/><path d="M376 197l10 8-10 8" fill="none" stroke="#70e1c4" stroke-width="3"/>

  <g transform="translate(410 94)">
    <text class="label">02 · ANALYSIS</text>
    <text y="33" class="title">Structure and test</text>
    <rect y="57" width="360" height="205" rx="14" fill="#0f1a2d" stroke="#263955"/>
    <text x="20" y="92" class="small">ASSUMPTION COVERAGE</text>
    <rect x="20" y="108" width="320" height="10" rx="5" fill="#21334c"/><rect x="20" y="108" width="235" height="10" rx="5" fill="url(#line)"/>
    <text x="20" y="153" class="small">SCENARIO RANGE</text>
    <line x1="34" y1="178" x2="326" y2="178" stroke="#334863" stroke-width="4"/>
    <circle cx="98" cy="178" r="8" fill="#22d3ee"/><circle cx="265" cy="178" r="8" fill="#a3e635"/>
    <rect x="20" y="207" width="96" height="36" rx="7" fill="#17263d"/><rect x="132" y="207" width="96" height="36" rx="7" fill="#17263d"/><rect x="244" y="207" width="96" height="36" rx="7" fill="#17263d"/>
    <text x="33" y="230" class="small">CLEAN</text><text x="145" y="230" class="small">COMPARE</text><text x="257" y="230" class="small">VERIFY</text>
  </g>

  <path d="M798 205H850" stroke="url(#line)" stroke-width="3"/><path d="M842 197l10 8-10 8" fill="none" stroke="#70e1c4" stroke-width="3"/>

  <g transform="translate(878 94)">
    <text class="label">03 · OUTPUT</text>
    <text y="33" class="title">Decision support</text>
    <rect y="57" width="278" height="205" rx="14" fill="#0f1a2d" stroke="#263955"/>
    <text x="20" y="90" class="small">SIGNAL CLARITY</text>
    <text x="20" y="122" class="metric">ACTIONABLE</text>
    <line x1="20" y1="145" x2="258" y2="145" stroke="#263955"/>
    <text x="20" y="174" class="small">Evidence</text><circle cx="242" cy="169" r="6" fill="#a3e635"/>
    <text x="20" y="204" class="small">Limitations</text><circle cx="242" cy="199" r="6" fill="#a3e635"/>
    <text x="20" y="234" class="small">Next action</text><circle cx="242" cy="229" r="6" fill="#a3e635"/>
  </g>

  <text x="44" y="390" class="small">The chart represents a working method—not a self-rated proficiency score.</text>
</svg>
