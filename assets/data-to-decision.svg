<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Data-to-decision workflow</title>
  <desc id="desc">Five stages: question, data, analysis, visual, and decision.</desc>
  <rect width="1200" height="180" rx="16" fill="#0d1117"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <g fill="#161b22" stroke="#30363d">
      <rect x="35" y="42" width="190" height="96" rx="10"/>
      <rect x="270" y="42" width="190" height="96" rx="10"/>
      <rect x="505" y="42" width="190" height="96" rx="10"/>
      <rect x="740" y="42" width="190" height="96" rx="10"/>
      <rect x="975" y="42" width="190" height="96" rx="10"/>
    </g>
    <g fill="#58a6ff" font-size="12" font-weight="700" letter-spacing="1.5">
      <text x="130" y="70">01 · QUESTION</text><text x="365" y="70">02 · DATA</text><text x="600" y="70">03 · ANALYSIS</text><text x="835" y="70">04 · VISUAL</text><text x="1070" y="70">05 · DECISION</text>
    </g>
    <g fill="#f0f6fc" font-size="17" font-weight="600">
      <text x="130" y="104">Define the problem</text><text x="365" y="104">Structure &amp; check</text><text x="600" y="104">Compare scenarios</text><text x="835" y="104">Explain the finding</text><text x="1070" y="104">Choose next action</text>
    </g>
    <g fill="#8b949e" font-size="12">
      <text x="130" y="124">Goal · scope · metric</text><text x="365" y="124">Inputs · gaps · quality</text><text x="600" y="124">Patterns · risk · limits</text><text x="835" y="124">Chart · context · meaning</text><text x="1070" y="124">Evidence · trade-off</text>
    </g>
  </g>
  <g fill="none" stroke="#3fb950" stroke-width="2">
    <path d="M235 90h25m-8-7 8 7-8 7"/><path d="M470 90h25m-8-7 8 7-8 7"/><path d="M705 90h25m-8-7 8 7-8 7"/><path d="M940 90h25m-8-7 8 7-8 7"/>
  </g>
</svg>
